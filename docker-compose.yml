services:
  db:
    image: postgres:16-alpine
    container_name: eventos_qrcode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos_dev_password
      POSTGRES_DB: eventos_qrcode
    ports:
      - "5433:5432"
    volumes:
      - eventos_qrcode_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos_qrcode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eventos_qrcode_data:
